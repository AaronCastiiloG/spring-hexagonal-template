services:
  db:
    image: postgres:16-alpine
    container_name: spring-hexagonal-template-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: hexagonal_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hexagonal_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
